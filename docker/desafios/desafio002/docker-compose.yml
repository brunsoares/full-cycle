services:
  proxy:
    image: nginx:latest
    container_name: proxy
    ports:
      - '8080:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
  app:
    build:
      context: ./node
      dockerfile: dockerfile
    image: brunsoares/node_api
    container_name: app
    depends_on:
      - db
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    tty: true
    environment:
      - MYSQL_DATABASE=database
      - MYSQL_USER=sa
      - MYSQL_ROOT_PASSWORD=pass
      - MYSQL_PASSWORD=pass
